<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password · SkillFolio</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="card auth-card">
    <a class="brand brand-center" href="/"><span class="logo">S</span><span>SkillFolio</span></a>
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your email and we will generate a reset link.</p>
    <div class="form-error hidden" id="formError"></div>
    <div class="form-success hidden" id="formSuccess"></div>
    <form id="forgotForm" class="stack-form">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="/login.html">Back to log in</a></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
