<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password · SkillFolio</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="card auth-card">
    <a class="brand brand-center" href="/"><span class="logo">S</span><span>SkillFolio</span></a>
    <h1>Set a new password</h1>
    <div class="form-error hidden" id="formError"></div>
    <div class="form-success hidden" id="formSuccess"></div>
    <form id="resetForm" class="stack-form">
      <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"><span class="small muted">At least 8 characters, with a letter and a number.</span></div>
      <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" required autocomplete="new-password"></div>
      <button class="btn btn-primary btn-block" type="submit">Update password</button>
    </form>
    <p class="auth-switch"><a href="/login.html">Back to log in</a></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
