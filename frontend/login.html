<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · SkillFolio</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="card auth-card">
    <a class="brand brand-center" href="/"><span class="logo">S</span><span>SkillFolio</span></a>
    <h1>Welcome back</h1>
    <p class="muted">Log in to track your skills and progress.</p>
    <div class="form-error hidden" id="formError"></div>
    <form id="loginForm" class="stack-form">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <a class="small" href="/forgot-password.html">Forgot password?</a>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="/register.html">Create an account</a></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
